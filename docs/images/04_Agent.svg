<text x="72" y="137" text-anchor="start" font-family="serif" font-size="44" font-weight="400" fill="#292824">Ein Agent passt seine nächsten Schritte an.</text>
<text x="72" y="184" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="400" fill="#77746D">Das Modell entscheidet anhand der bisherigen Ergebnisse, wie es weitergeht.</text>
